[project]
name = "ai-outfit-stylist"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["Pillow==11.3.0", "numpy==2.2.6", "PyYAML==6.0.3"]

[project.optional-dependencies]
ml = ["torch==2.8.0", "transformers==4.55.4"]
app = [
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
    "SQLAlchemy==2.0.43",
    "alembic==1.16.5",
    "psycopg[binary]==3.2.10",
]
research = ["jupyterlab==4.4.7", "matplotlib==3.10.6", "pyarrow==19.0.1"]
dev = ["httpx==0.28.1", "pytest==8.4.2", "pytest-cov==6.3.0", "ruff==0.12.12"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
