server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 6m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $stylist_backend http://backend:8000;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location /api/ {
        limit_req zone=stylist burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $stylist_backend;
        proxy_read_timeout 180s;
    }
    location = /health/live {
        proxy_pass $stylist_backend;
    }
    location = /health/ready {
        proxy_pass $stylist_backend;
        proxy_read_timeout 120s;
    }
    error_page 413 = @upload_limit;
    location @upload_limit {
        default_type application/json;
        return 413 '{"error":{"code":"file_too_large","message":"Upload exceeds the request limit"}}';
    }
    error_page 429 = @rate_limit;
    location @rate_limit {
        default_type application/json;
        return 429 '{"error":{"code":"rate_limited","message":"Try again shortly"}}';
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
limit_req_zone $binary_remote_addr zone=stylist:10m rate=5r/s;
