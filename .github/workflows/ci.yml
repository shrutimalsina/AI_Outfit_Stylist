name: Checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stylist
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/stylist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install uv==0.8.22
      - run: uv sync --project backend --locked --extra app --extra research --extra dev
      - run: backend/.venv/bin/ruff check backend pipeline scripts
      - run: backend/.venv/bin/alembic -c backend/alembic.ini upgrade head
      - run: STYLIST_TEST_DATABASE_URL="$DATABASE_URL" backend/.venv/bin/python -m pytest backend/tests
      - run: npm ci && npm run build
        working-directory: frontend
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/smoke_compose.sh
